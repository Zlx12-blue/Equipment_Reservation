server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lab_reservation}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

flowable:
  database-schema-update: true   # 自动创建 ACT_* 流程表
  check-process-definitions: true
  process-definition-location-prefix: classpath*:/processes/
  process-definition-location-suffixes: "*.bpmn20.xml,*.bpmn"

jwt:
  secret: ${JWT_SECRET:lab-reservation-secret-key-please-change-in-production-0123456789}
  expiration-ms: 86400000

logging:
  level:
    org.flowable: warn
